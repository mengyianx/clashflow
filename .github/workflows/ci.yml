name: CI

# 镜像与发版全部在 GitHub 上做，本地不构建。
#   pull_request          -> lint / 类型 / 测试，再对三种架构做一次「不推送」的
#                            镜像构建（只验证 Dockerfile，不发版）
#   push flow             -> 只跑质量门，不发版
#   workflow_dispatch     -> 手动发版：发布镜像（vX.Y.Z / vX.Y / latest）并建 GitHub Release
on:
  pull_request:
  push:
    branches: [flow]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，格式 vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

# 只取消被覆盖的 PR run；发版与分支 run 不可取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: lint / type-check / tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web shell (tests serve web/dist)
        run: |
          cd web
          npm ci
          npm run build

      - name: Install
        run: pip install -e '.[dev]'

      - name: Fetch pinned Kernel and dashboard bundles
        run: |
          bash scripts/fetch-kernel.sh
          bash scripts/fetch-ui.sh
          bash scripts/fetch-zui.sh

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy clashflow tests

      # The seam suite binds the fixed contract ports (9090/7890) on the host,
      # so it must run serialized — a single job is serial by construction.
      - name: Tests
        run: pytest -q

  image:
    name: image build (verify only)
    # PRs validate the Dockerfile across all three platforms; nothing is pushed.
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    # QEMU builds can stall instead of failing; the frontend stage builds
    # natively (Dockerfile pins $BUILDPLATFORM), and this bound keeps a future
    # stall from eating a runner for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # arm/v7 is best-effort: only the Kernel stage is emulated.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: manual release
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          v="${{ inputs.version }}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须形如 v1.2.3，收到：$v"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "MINOR=${v%.*}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.MINOR }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<EOF
          容器镜像（linux/amd64、linux/arm64、linux/arm/v7）：

          \`\`\`
          ghcr.io/${{ github.repository }}:$VERSION
          \`\`\`

          发版提交：${{ github.sha }}
          EOF
          gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/notes.md
