name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint / type-check / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web shell (tests serve web/dist)
        run: |
          cd web
          npm ci
          npm run build

      - name: Install
        run: pip install -e '.[dev]'

      - name: Fetch pinned Kernel and Runtime Dashboard bundles
        run: |
          bash scripts/fetch-kernel.sh
          bash scripts/fetch-ui.sh

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy clashflow tests

      # The seam suite binds the fixed contract ports (9090/7890) on the host,
      # so it must run serialized — a single job is serial by construction.
      - name: Tests
        run: pytest -q

  image:
    name: multi-arch image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # README quick-start pins :latest; the `latest` tag is produced only on
      # pushes to the integration branch `flow` (latest=auto would never fire
      # — there are no tag/semver/match events here).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/flow' }}

      # arm/v7 is best-effort (ticket #18): the image matrix is amd64 + arm64,
      # plus arm/v7 while its dependency wheels keep resolving (PyYAML has no
      # armv7l wheel — nothing imports it today; revisit if that changes).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
